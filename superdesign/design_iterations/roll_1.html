<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>52-0 — Era Roll</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #0b0b10; --ink-2: #16161f; --ink-3: #202030;
  --paper: #f3efe4; --paper-dim: #b8b4a8;
  --gold: #e8b923; --gold-dim: #a5871f;
  --magenta: #e23f86; --magenta-dim: #7d2249;
  --line: rgba(243, 239, 228, 0.12);
  --font-display: "Anton", sans-serif;
  --font-body: "Space Grotesk", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--ink); color: var(--paper); font-family: var(--font-body); min-height: 100%; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100vh; padding: 28px 20px 40px; position: relative; overflow-x: hidden; }
.screen-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.numfield { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); opacity: 0.05; overflow: hidden; pointer-events: none; user-select: none; z-index: 0; }
.numfield span { font-family: var(--font-display); font-size: 15vw; line-height: 1; color: var(--paper); text-align: center; padding: 4px 0; }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; }
.btn { font-family: var(--font-body); font-weight: 700; font-size: 17px; border: none; border-radius: 999px; padding: 18px 40px; cursor: pointer; }
.btn-primary { background: var(--magenta); color: var(--paper); box-shadow: 0 8px 24px rgba(226, 63, 134, 0.35); }
.btn-ghost { background: transparent; color: var(--paper-dim); border: 1.5px solid var(--line); padding: 14px 28px; font-size: 14px; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn-wide { width: 100%; }
.stack { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 380px; margin: 0 auto; }
.step-label { font-family: var(--font-body); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; color: var(--magenta); margin-bottom: 6px; }
.roll-value { font-family: var(--font-display); font-size: clamp(46px, 15vw, 84px); line-height: 1; color: var(--gold); margin: 10px 0 6px; min-height: 1.1em; }
.roll-sub { color: var(--paper-dim); font-size: 14px; margin-bottom: 30px; }
</style>
</head>
<body>
<div id="root">
  <!-- Current state, extracted from RollScreen() in game/index.html. This is the "era reveal" moment shown at the top of every round (6x per playthrough).
       Known gap: while settled it shows only the step label, value and two buttons — there's no round/progress context here (that only appears on the NEXT screen), so a player who reopens the game mid-round can't tell where they are.
       Feed to superdesign_iterate with feedback like: "add round progress context to this reveal moment without breaking the dramatic centered reveal; give the reroll option more visual presence since it's a strategic decision, not an afterthought." -->
  <div class="screen">
    <div class="numfield">
      <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span>
      <span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span>
      <span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span>
    </div>
    <div class="content screen-center">
      <div class="step-label">YOUR ERA</div>
      <div class="roll-value">1990s</div>
      <div class="roll-sub">Locked in? Or take one reroll.</div>
      <div class="stack">
        <button class="btn btn-primary btn-wide">Accept</button>
        <button class="btn btn-ghost btn-wide">Reroll — 1 left</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
