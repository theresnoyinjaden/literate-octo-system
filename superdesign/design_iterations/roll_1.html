<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>52-0 — Era &amp; Genre Roll</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #0b0b10; --ink-2: #16161f; --ink-3: #202030;
  --paper: #f3efe4; --paper-dim: #b8b4a8;
  --gold: #e8b923; --gold-dim: #a5871f;
  --magenta: #e23f86; --magenta-dim: #7d2249;
  --line: rgba(243, 239, 228, 0.12);
  --font-display: "Anton", sans-serif;
  --font-body: "Space Grotesk", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--ink); color: var(--paper); font-family: var(--font-body); min-height: 100%; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100vh; padding: 28px 20px 40px; position: relative; overflow-x: hidden; }
.screen-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.numfield { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); opacity: 0.05; overflow: hidden; pointer-events: none; user-select: none; z-index: 0; }
.numfield span { font-family: var(--font-display); font-size: 15vw; line-height: 1; color: var(--paper); text-align: center; padding: 4px 0; }
.content { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; }
.btn { font-family: var(--font-body); font-weight: 700; font-size: 17px; border: none; border-radius: 999px; padding: 18px 40px; cursor: pointer; }
.btn-primary { background: var(--magenta); color: var(--paper); box-shadow: 0 8px 24px rgba(226, 63, 134, 0.35); }
.btn-ghost { background: transparent; color: var(--paper-dim); border: 1.5px solid var(--line); padding: 14px 28px; font-size: 14px; }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn-wide { width: 100%; }
.stack { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 380px; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.pillbadge { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink); background: var(--gold); border-radius: 999px; padding: 6px 14px; }
.round-track { display: flex; gap: 6px; margin: 4px 0 22px; }
.round-dot { flex: 1; height: 5px; border-radius: 3px; background: var(--ink-3); }
.round-dot.done { background: var(--gold); }
.round-dot.active { background: var(--magenta); }
.slot-row { display: flex; gap: 12px; width: 100%; max-width: 380px; margin: 0 auto; }
.slot-box { flex: 1; min-width: 0; background: var(--ink-2); border: 1px solid var(--line); border-radius: 18px; padding: 20px 10px; text-align: center; }
.slot-label { font-family: var(--font-body); font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--magenta); margin-bottom: 10px; }
.slot-value { font-family: var(--font-display); font-size: clamp(22px, 7vw, 32px); line-height: 1.1; color: var(--gold); min-height: 1.1em; overflow-wrap: break-word; }
.artist-reveal { min-height: 64px; display: flex; align-items: center; justify-content: center; margin: 26px 0; }
.artist-name { font-family: var(--font-display); font-size: clamp(34px, 9vw, 52px); line-height: 1.02; color: var(--paper); }
.reroll-row { display: flex; gap: 10px; width: 100%; max-width: 380px; margin: 0 auto 14px; }
.reroll-row .btn { flex: 1; padding: 14px 8px; font-size: 12px; white-space: nowrap; }
</style>
</head>
<body>
<div id="root">
  <!-- Current state, extracted from DraftFlow()'s "roll" subPhase in game/index.html: era and genre now roll simultaneously as two side-by-side slot reels, settle independently, reveal the drafted artist below once both land, and each reel can be rerolled once per round.
       Possible next round of polish: the two reels currently settle in lockstep visual weight — a staggered settle (genre landing a beat after era) or a per-reel "locking" sound/flash cue would sell the slot-machine metaphor harder. The artist reveal itself is a plain name with no entrance flourish beyond a fade — could earn the same celebratory treatment as the ResultScreen's number reveal. -->
  <div class="screen">
    <div class="content">
      <div class="topbar">
        <span class="pillbadge">2000s · PUNK ROCK</span>
        <span class="pillbadge" style="background:var(--magenta);color:var(--paper)">Round 1/6</span>
      </div>
      <div class="round-track">
        <div class="round-dot active"></div>
        <div class="round-dot"></div>
        <div class="round-dot"></div>
        <div class="round-dot"></div>
        <div class="round-dot"></div>
        <div class="round-dot"></div>
      </div>
      <div class="screen-center">
        <div class="slot-row">
          <div class="slot-box">
            <div class="slot-label">Your era</div>
            <div class="slot-value">2000s</div>
          </div>
          <div class="slot-box">
            <div class="slot-label">Your genre</div>
            <div class="slot-value">Punk Rock</div>
          </div>
        </div>
        <div class="artist-reveal">
          <div class="artist-name">Green Day</div>
        </div>
        <div class="reroll-row">
          <button class="btn btn-ghost">Reroll era — 1 left</button>
          <button class="btn btn-ghost">Reroll genre — 1 left</button>
        </div>
        <div class="stack" style="margin-top:14px">
          <button class="btn btn-primary btn-wide">Accept</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
